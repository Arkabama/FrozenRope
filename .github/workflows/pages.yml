name: Deploy Frozen Rope site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Assemble static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html styles.css _site/
          cp frozenrope.logoalt.png frozenrope.logomain.png _site/
          cp frozenrope.01.png frozenrope.02.png frozenrope.04.png frozenrope.06.png _site/
          cp frozenrope.07.png frozenrope.09.png frozenrope.10.png frozenrope.19.png _site/
          cp frozenrope.22.png frozenrope.23.png frozenrope.28.png frozenrope.39.png _site/
          cp frozenrope.08b.png frozenrope.11b.png frozenrope.13b.png _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
